# Copy to src/main/resources/application-dev.yaml on each developer machine.
# This file contains placeholders, not credentials. Do not use HTTP/local DB settings in production.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/agent_work_foot?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: ${AGENT_WORK_FOOT_DB_USERNAME}
    password: ${AGENT_WORK_FOOT_DB_PASSWORD}
  flyway:
    enabled: true
server:
  address: 0.0.0.0
  port: 8080
app:
  auth:
    jwt:
      active-secret: ${APP_AUTH_JWT_ACTIVE_SECRET}
  web:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
