spring:
  application:
    name: agent_work_foot
  profiles:
    active: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  wechat:
    mini-program:
      # 只允许通过环境变量注入；AppSecret 绝不能写入小程序、Git 或日志。
      app-id: ${WECHAT_MINI_PROGRAM_APP_ID:}
      app-secret: ${WECHAT_MINI_PROGRAM_APP_SECRET:}
      code2-session-url: https://api.weixin.qq.com/sns/jscode2session
  admin:
    temporary-password-ttl: PT30M
    rate-limit:
      target-max-attempts: 5
      target-window: PT15M
      admin-max-attempts: 30
      admin-window: PT1H
    bootstrap:
      enabled: false
      email: ""
  account-security:
    rate-limit:
      max-attempts: 5
      window: PT15M
  slot:
    spin-ttl: PT5M
    rate-limit:
      max-attempts: 60
      window: PT1M
  auth:
    jwt:
      issuer: agent-work-foot
      active-key-id: current
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    rate-limit:
      login-max-attempts: 10
      login-window: PT15M
      register-max-attempts: 10
      register-window: PT1H
      refresh-max-attempts: 60
      refresh-window: PT1M
